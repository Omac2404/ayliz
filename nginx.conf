server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Ters proxy (EasyPanel/Traefik) arkasinda dogru yonlendirme icin
    absolute_redirect off;
    port_in_redirect off;

    # ---------- Guvenlik basliklari ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- Sikistirma ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/xml+rss;

    # ---------- Temiz URL: /iletisim -> /iletisim/index.html ----------
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ---------- Statik varliklar ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    # HTML dosyalari her zaman taze
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
